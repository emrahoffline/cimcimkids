services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cimcimkids}
      POSTGRES_USER: ${POSTGRES_USER:-cimcim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cimcim} -d ${POSTGRES_DB:-cimcimkids}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cimcim}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cimcimkids}
      TRUST_PROXY: "true"
      NODE_ENV: production
    volumes:
      - uploads:/app/public/products/uploads
      - ./data:/app/data
    expose:
      - "3000"

  migrate:
    image: node:22-bookworm-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cimcim}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cimcimkids}
    volumes:
      - ./prisma:/app/prisma:ro
      - migrate_npm:/root/.npm
    command:
      - sh
      - -c
      - apt-get update -qq && apt-get install -y -qq openssl ca-certificates >/dev/null && npx --yes prisma@6.19.0 migrate deploy --schema=./prisma/schema.prisma

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
  migrate_npm:
